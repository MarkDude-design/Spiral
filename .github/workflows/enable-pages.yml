name: Enable Pages (one-shot)
# Turns on GitHub Pages serving from the main branch root.
# Idempotent: 201 = created, 409 = already exists. Re-run via workflow_dispatch if ever needed.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enable-pages.yml']
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages site from main /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')
          cat /tmp/pages.json || true
          echo "HTTP $code"
          [ "$code" = "201" ] || [ "$code" = "409" ]
