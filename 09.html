<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Bodies &#8212; The Loom</title>
<!--
  Spiral 09 &#8212; The Loom
  Source: Project-Spiral foundry round 2026-10-28
  (experiments/2026-10-28/spiral-02-the-loom.html; recovered-thread architect:
  Meraki; the owner explicitly favored this variant as the pattern worth
  matching). Ported to the series panel 2026-11-05.
  Convention: designed kinematic geometry, not physical gravity. Two fixed
  eyelets (A, B) and one moving needle (C) trace a center-crossing figure
  eight. DISTURB bends the route, plants a persistent knot in the cloth, and
  adds a damped reaction plus a small whole-cloth twist. Recovery returns the
  weave, not the record: knots survive recovery until Reset (cloth memory,
  max 8 knots).
  Verification receipt: functional port QA in the series style; no
  orbit-integration check applies to designed geometry. Mechanics preserved
  from the source file: tap-direction knots with alternating bias, 8-knot
  bound, twist decay, weave-size slider, trail drawn as accumulated stitches.
  Honest limits: this branch of the family has no DISPERSED state; the state
  line runs PERIODIC -> PERTURBED -> RECOVERED / MARKED.
-->
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#090b18;color:#f5f5f4;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}.panel{position:fixed;top:10px;left:10px;width:255px;padding:9px;border:1px solid #ffffff35;border-radius:7px;background:#090b18c9;backdrop-filter:blur(8px)}.row{display:grid;grid-template-columns:1fr auto;gap:7px;margin-bottom:7px}button{min-height:33px;padding:5px 9px;border:1px solid #ffffff42;border-radius:4px;background:#25283a;color:white;font:700 12px system-ui;cursor:pointer}button:first-child{background:#a9313b}.status{height:4px;background:#2b2e40;margin-bottom:7px;overflow:hidden}.status i{display:block;height:100%;background:#ff5764;transition:width .2s}label{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:5px;color:#aaa;font:700 10px ui-monospace,monospace}input{width:100%;accent-color:#ff5764}.state{text-align:center;color:#aeb3cc;font:700 10px ui-monospace,monospace;letter-spacing:.08em}@media(max-width:520px){.panel{width:220px;padding:7px}}
</style></head><body>
<canvas id="c" aria-label="Two fixed eyelets and one moving needle weaving a figure eight; disturbances leave knots in the cloth"></canvas>
<div class="panel"><div class="status"><i id="marks"></i></div><div class="row"><button id="disturb">Disturb</button><button id="reset">Reset</button></div><label><span id="weaveOut">100%</span><input id="weave" type="range" min="60" max="130" step="1" value="100"></label><div class="state" id="state">PERIODIC</div></div>
<script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),
weave=document.querySelector('#weave'),weaveOut=document.querySelector('#weaveOut'),
marksBar=document.querySelector('#marks'),stateEl=document.querySelector('#state'),
disturbBtn=document.querySelector('#disturb');
let W=0,H=0,DPR=1,cx=0,cy=0,Rx=0,Ry=0,gap=0,phase=0,prior=performance.now(),time=0;
let px=0,py=0,vx=0,vy=0,twist=0,twistVel=0;
const trail=[],knots=[],pulses=[];
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);
canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
ctx.setTransform(DPR,0,0,DPR,0,0);cx=W/2;cy=H*(W<700?.45:.54);
Rx=Math.min(W*.345,385);Ry=Math.min(H*.225,Rx*.445,176);gap=Rx*.69;trail.length=0}
function wrap(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b))}
function raw(t){const s=Number(weave.value)/100;
let x=Rx*s*Math.sin(t),y=-Ry*s*Math.sin(2*t);
for(const k of knots){const amt=Math.exp(-4*wrap(t,k.phase)**2);
x+=Math.cos(k.angle)*Math.min(8,Rx*.023)*amt;y+=Math.sin(k.angle)*Math.min(8,Ry*.09)*amt}
return{x,y}}
function point(t=phase){const p=raw(t),co=Math.cos(twist),si=Math.sin(twist);
return{x:cx+p.x*co-p.y*si+px,y:cy+p.x*si+p.y*co+py}}
function setState(txt){stateEl.textContent=txt}
function drawMarks(){marksBar.style.width=(knots.length/8*100)+'%'}
function disturb(x=cx,y=cy){const k=point();
const angle=Math.atan2(y-cy,x-cx)+(knots.length%2?-.62:.62);
knots.push({phase,angle,px:k.x,py:k.y,created:time});
if(knots.length>8)knots.shift();
vx+=Math.cos(angle)*2.3;vy+=Math.sin(angle)*2.3;
twistVel+=knots.length%2?.018:-.022;
pulses.push({x,y,t:0});setState('PERTURBED');drawMarks()}
function reset(){phase=0;time=0;px=py=vx=vy=twist=twistVel=0;
knots.length=trail.length=pulses.length=0;weave.value=100;weaveOut.textContent='100%';
prior=performance.now();setState('PERIODIC');drawMarks()}
function bpath(fn){ctx.beginPath();for(let i=0;i<=250;i++){const a=i*Math.PI*2/250;
const p=fn(a);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}}
function draw(){ctx.clearRect(0,0,W,H);
// cloth grid: the passive record surface, not an additional body
ctx.lineWidth=1;for(let i=-20;i<=20;i++){const y=cy+i*24;
ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.strokeStyle='rgba(118,159,151,.045)';ctx.stroke()}
for(let i=-30;i<=30;i++){const x=cx+i*25;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);
ctx.strokeStyle='rgba(118,159,151,.027)';ctx.stroke()}
// dashed reference weave
ctx.setLineDash([3,10]);ctx.strokeStyle='rgba(148,198,189,.15)';ctx.lineWidth=1.3;
bpath(t=>{const s=Number(weave.value)/100;return{x:cx+Rx*s*Math.sin(t),y:cy-Ry*s*Math.sin(2*t)}});
ctx.stroke();ctx.setLineDash([]);
// the trail is accumulated stitches, not a theoretical orbit
if(trail.length>1){for(let i=1;i<trail.length;i++){const p=trail[i-1],q=trail[i],age=i/trail.length;
ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.lineCap='round';
ctx.lineWidth=age>.8?2.1:1.05;ctx.strokeStyle='rgba(233,187,117,'+(.06+.74*Math.pow(age,2.4))+')';ctx.stroke()}
const i0=Math.max(0,trail.length-55);ctx.beginPath();
for(let j=i0;j<trail.length;j++){const p=trail[j];j===i0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)}
ctx.strokeStyle='rgba(255,226,161,.56)';ctx.lineWidth=2.6;ctx.stroke()}
// eyelets A and B
for(let j=0;j<2;j++){const x=cx+(j?gap:-gap),id=j?'B':'A';
ctx.beginPath();ctx.arc(x,cy,29,0,Math.PI*2);ctx.strokeStyle='rgba(137,187,185,.17)';ctx.lineWidth=1;ctx.stroke();
ctx.beginPath();ctx.arc(x,cy,19.5,0,Math.PI*2);ctx.strokeStyle='#8cc4bb';ctx.lineWidth=3.1;ctx.stroke();
for(let k=0;k<12;k++){const a=k*Math.PI/6;ctx.beginPath();
ctx.moveTo(x+23*Math.cos(a),cy+23*Math.sin(a));ctx.lineTo(x+26*Math.cos(a),cy+26*Math.sin(a));
ctx.strokeStyle='#6d9c99';ctx.lineWidth=1;ctx.stroke()}
ctx.fillStyle='#aecbc3';ctx.textAlign='center';ctx.font='700 11px ui-monospace,monospace';
ctx.fillText(id,x,cy+4)}
// persistent knots: disturbance survives even when the needle settles
for(const k of knots){ctx.save();ctx.translate(k.px,k.py);ctx.rotate(k.angle);
ctx.strokeStyle='rgba(246,209,138,.65)';ctx.lineWidth=1.6;ctx.beginPath();
ctx.moveTo(-7,-5);ctx.lineTo(7,5);ctx.moveTo(-7,5);ctx.lineTo(7,-5);ctx.stroke();
ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.strokeStyle='rgba(246,209,138,.2)';ctx.stroke();ctx.restore()}
for(let j=pulses.length-1;j>=0;j--){const p=pulses[j],r=25+150*p.t;
ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
ctx.strokeStyle='rgba(246,209,138,'+Math.max(0,.5*(1-p.t))+')';ctx.lineWidth=1.2;ctx.stroke()}
// the needle
const p=point();const angle=Math.atan2(-2*Ry*Math.cos(2*phase),Rx*Math.cos(phase));
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(angle);
const g=ctx.createRadialGradient(0,0,2,0,0,34);
g.addColorStop(0,'rgba(255,229,167,.25)');g.addColorStop(1,'rgba(255,229,167,0)');
ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.fill();
ctx.fillStyle='#f6d397';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-7,-6.5);
ctx.lineTo(-3,0);ctx.lineTo(-7,6.5);ctx.closePath();ctx.fill();ctx.restore()}
function tick(now){const dt=Math.min(.046,(now-prior)/1000||0);prior=now;
time+=dt;phase=(phase+dt*.84)%(Math.PI*2);
vx+=(-px*.034-vx*.17)*(dt*60);vy+=(-py*.034-vy*.17)*(dt*60);
px+=vx*(dt*60);py+=vy*(dt*60);
twistVel+=(-twist*.024-twistVel*.14)*(dt*60);twist+=twistVel*(dt*60);
const p=point();trail.push({x:p.x,y:p.y});if(trail.length>680)trail.shift();
for(let j=pulses.length-1;j>=0;j--){pulses[j].t+=dt/1.6;if(pulses[j].t>=1)pulses.splice(j,1)}
if(knots.length&&time-knots[knots.length-1].created>2.7)setState('RECOVERED / MARKED');
draw();requestAnimationFrame(tick)}
canvas.addEventListener('pointerdown',e=>disturb(e.clientX,e.clientY));
disturbBtn.addEventListener('click',e=>{e.stopPropagation();disturb(cx+Rx*.15,cy-Ry*.42)});
document.querySelector('#reset').onclick=e=>{e.stopPropagation();reset()};
weave.oninput=()=>{weaveOut.textContent=weave.value+'%';trail.length=0};
addEventListener('resize',resize);
resize();reset();requestAnimationFrame(tick);
</script></body></html>
