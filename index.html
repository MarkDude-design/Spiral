<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Bodies &#8212; Spiral Worlds</title>
<!--
  Spiral viewer v1 &#8212; the cart.
  Each world is a standalone self-contained HTML file; this page frames one at a
  time and supplies the NEXT / PREV rail. Adding a world = adding a file + one
  row in the WORLDS list. No build step, no dependencies, no backend.
  Controls: PREV / NEXT buttons, &#8592; &#8594; arrow keys, CYCLE auto-advances every 20s,
  &#8599; opens the current world standalone. The URL hash deep-links (#03).
-->
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090b18;color:#f5f5f4;font-family:system-ui,sans-serif}
iframe{border:0;width:100vw;height:100vh;display:block}
#load{position:fixed;top:12px;right:12px;color:#64748b;font:700 10px ui-monospace,monospace;letter-spacing:.08em}
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;
padding:8px 10px;border:1px solid #ffffff35;border-radius:7px;background:#090b18c9;backdrop-filter:blur(8px);
font:700 12px ui-monospace,monospace;letter-spacing:.04em;max-width:calc(100vw - 20px)}
button{min-height:33px;padding:5px 11px;border:1px solid #ffffff42;border-radius:4px;background:#25283a;color:#fff;
font:700 12px system-ui;cursor:pointer;white-space:nowrap}
button:hover{background:#3a3e55}
button.acc{background:#a9313b}
#pos{color:#aeb3cc;min-width:170px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a{color:#aeb3cc;text-decoration:none;display:flex;align-items:center;min-height:33px;padding:0 11px;
border:1px solid #ffffff42;border-radius:4px;white-space:nowrap}
a:hover{background:#3a3e55}
@media(max-width:600px){#pos{min-width:100px;font-size:10px}button,a{padding:5px 8px}}
</style></head><body>
<div id="load">LOADING&#8230;</div>
<iframe id="stage" title="Three-body world"></iframe>
<div class="bar">
<button id="prev" title="Previous world (&#8592;)">&#8249; PREV</button>
<div id="pos">01 / 08</div>
<button id="next" class="acc" title="Next world (&#8594;)">NEXT &#8250;</button>
<button id="cycle" title="Auto-advance every 20 seconds">CYCLE: OFF</button>
<a id="solo" href="01.html" target="_blank" rel="noopener" title="Open this world standalone">&#8599;</a>
</div>
<script>
const WORLDS=[
{file:'01.html',name:'Anchored Springs'},
{file:'02.html',name:'Relationship Space'},
{file:'03.html',name:'Figure Eight'},
{file:'04.html',name:'Moth I'},
{file:'05.html',name:'Broucke\u2013H\u00e9non'},
{file:'06.html',name:'Lagrange Triangle'},
{file:'07.html',name:'Newest'},
{file:'08.html',name:'Yin-Yang I'},
{file:'09.html',name:'The Loom'},
{file:'10.html',name:'Lentic'}
];
const stage=document.getElementById('stage'),pos=document.getElementById('pos'),
solo=document.getElementById('solo'),cycleBtn=document.getElementById('cycle'),
loadEl=document.getElementById('load');
let i=0,timer=null;
function pad(n){return (n<10?'0':'')+n}
function show(k){
i=(k+WORLDS.length)%WORLDS.length;
stage.src=WORLDS[i].file;
loadEl.textContent='LOADING\u2026';
pos.textContent=pad(i+1)+' / '+pad(WORLDS.length)+' \u00b7 '+WORLDS[i].name;
solo.href=WORLDS[i].file;
history.replaceState(null,'','#'+pad(i+1));
}
stage.addEventListener('load',()=>{loadEl.textContent=''});
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('next').onclick=()=>show(i+1);
cycleBtn.onclick=()=>{
if(timer){clearInterval(timer);timer=null;cycleBtn.textContent='CYCLE: OFF';cycleBtn.classList.remove('acc')}
else{timer=setInterval(()=>show(i+1),20000);cycleBtn.textContent='CYCLE: 20s';cycleBtn.classList.add('acc')}};
addEventListener('keydown',e=>{
if(e.key==='ArrowLeft')show(i-1);
if(e.key==='ArrowRight')show(i+1)});
const h=parseInt(location.hash.slice(1),10);
show(!isNaN(h)&&h>=1&&h<=WORLDS.length?h-1:0);
</script></body></html>
